<a class="card" [routerLink]="['/products', product().id]">

    @if (product().images.length > 0) {
    <img class="card__img" [src]="product().images[0].url" [alt]="product().name" />
    } @else {
    <div class="card__img card__img--empty">Sin imagen</div>
    }

    <div class="card__body">
        <h3 class="card__name">{{ product().name }}</h3>
        <p class="card__category">{{ product().category.name }}</p>
        <p class="card__price">{{ product().price | currency:'COP':'symbol-narrow':'1.0-0' }}</p>

        @if (product().stock > 0) {
        <span class="card__stock">{{ product().stock }} disponibles</span>
        } @else {
        <span class="card__stock card__stock--out">Agotado</span>
        }
    </div>

</a>
