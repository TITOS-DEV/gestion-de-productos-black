<div class="profile-page">
  <h1>Mi perfil</h1>

  @if (profile) {
    <section class="profile-info">
      <p><strong>Nombre:</strong> {{ profile.name }}</p>
      <p><strong>Email:</strong> {{ profile.email }}</p>
    </section>
  } @else {
    <p>Cargando perfil...</p>
  }

  <section class="password-form">
    <h2>Cambiar contraseña</h2>

    <form (ngSubmit)="onChangePassword()">
     <label for="current-password">Contraseña actual</label>
<input id="current-password" type="password" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" required />

<label for="new-password">Nueva contraseña</label>
<input id="new-password" type="password" [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password" required />

<label for="confirm-password">Confirmar nueva contraseña</label>
<input id="confirm-password" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" required />

      @if (passwordError) {
        <p class="form-error">{{ passwordError }}</p>
      }
      @if (passwordSuccess) {
        <p class="form-success">{{ passwordSuccess }}</p>
      }

      <button type="submit">Actualizar contraseña</button>
    </form>
  </section>
</div>
