<!--
  (ngSubmit) se dispara al enviar el formulario (botón submit o Enter
  dentro de un input). Mejor que (click) porque también capta el Enter.
-->
<form (ngSubmit)="onSubmit()">

  <label>Email</label>
  <!--
    [(ngModel)] combina:
      [ngModel] → property binding (variable → input)
      (ngModel) → event binding   (input → variable)
    "name" es obligatorio: Angular lo usa para identificar el campo
    dentro del formulario.
  -->
  <input type="email" [(ngModel)]="email" name="email" required />

  <label>Contraseña</label>
  <input type="password" [(ngModel)]="password" name="password" required />

  <!--
    @if es la sintaxis de control de flujo de Angular (reemplaza *ngIf).
    Solo muestra el <p> cuando errorMessage tiene contenido.
  -->
  @if (errorMessage) {
    <p style="color: red">{{ errorMessage }}</p>
  }

  <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>

  <button type="submit">Iniciar sesión</button>
</form>
